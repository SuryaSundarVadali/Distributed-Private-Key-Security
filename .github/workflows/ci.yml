name: DeFi Agent System CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Phase 1: Code Quality Checks
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Infrastructure/requirements.txt
          pip install pylint black flake8 bandit safety

      - name: Run Black formatter check
        run: black --check . || true

      - name: Run Flake8 linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run Pylint
        run: |
          find . -name "*.py" -not -path "./__pycache__/*" -not -path "./.venv/*" | xargs pylint --disable=all --enable=E,F || true

      - name: Security scan with Bandit
        run: bandit -r . -f json -o bandit-report.json || true

      - name: Check dependencies for vulnerabilities
        run: safety check --json || true

  # Phase 2: Unit Tests (Phases 1-4)
  unit-tests:
    name: Unit Tests - All Phases
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        phase: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Infrastructure/requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Run Phase ${{ matrix.phase }} tests
        run: |
          python test_phase${{ matrix.phase }}.py
        timeout-minutes: 10

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-phase-${{ matrix.phase }}
          path: |
            test-results/
            coverage/

  # Phase 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Infrastructure/requirements.txt

      - name: Run complete system test
        run: python test_complete_system.py
        timeout-minutes: 15

  # Phase 4: Docker Build & Test
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Scheduler image
        run: |
          docker build -f Infrastructure/Dockerfile.scheduler -t defi-scheduler:test .
        working-directory: ${{ github.workspace }}

      - name: Build Node image
        run: |
          docker build -f Infrastructure/Dockerfile.node -t defi-node:test .
        working-directory: ${{ github.workspace }}

      - name: Build Monitor image
        run: |
          docker build -f Infrastructure/Dockerfile.monitor -t defi-monitor:test .
        working-directory: ${{ github.workspace }}

      - name: Test docker-compose configuration
        run: |
          docker-compose -f Infrastructure/docker-compose.yaml config

      - name: Run docker-compose health check
        run: |
          cd Infrastructure
          docker-compose up -d
          sleep 30
          docker-compose ps
          docker-compose logs
          docker-compose down -v

  # Phase 5: Performance Tests
  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Infrastructure/requirements.txt
          pip install locust pytest-benchmark

      - name: Run performance tests
        run: |
          python Scripts/performance_test.py
        timeout-minutes: 20

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance-results/

  # Phase 6: Security Audit (on main branch only)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: performance-tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Phase 7: Deployment (main branch only)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (if using AWS)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run deployment script
        run: |
          chmod +x Scripts/deploy.sh
          ./Scripts/deploy.sh production
        env:
          DEPLOY_ENV: production
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || '' }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || '' }}

      - name: Health check after deployment
        run: |
          sleep 60
          curl -f https://defi-agents.example.com/health || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ./Scripts/deploy.sh rollback

  # Notification
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'DeFi Agent System deployment: ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
